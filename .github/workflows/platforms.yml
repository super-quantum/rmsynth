name: Platform smoke tests

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install build
      - run: python -m build --wheel
      - run: python -m pip install --no-index --find-links dist rmsynth-reference
      - run: rmsynth-ref --version
      - run: python -c "from rmsynth_reference import Circuit, optimize; assert optimize(Circuit(1)).report.verified"
      - run: cmake -S . -B build/native -DRMSYNTH_BUILD_PYTHON=OFF -DBUILD_TESTING=ON -DRMSYNTH_WARNINGS_AS_ERRORS=ON
      - run: cmake --build build/native --config Release --parallel
      - run: ctest --test-dir build/native --build-config Release --output-on-failure
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wheel-${{ matrix.os }}
          path: dist/*.whl
