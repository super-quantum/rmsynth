name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
      - run: python -m pip install -e '.[dev]'
      - run: ruff check .
      - run: ruff format --check .
      - run: clang-format --dry-run --Werror cpp/include/rmsynth_reference/core.hpp cpp/src/*.cpp cpp/tests/*.cpp
      - run: mypy src
      - run: pytest --cov
      - run: cmake -S . -B build/native -DRMSYNTH_BUILD_PYTHON=OFF -DBUILD_TESTING=ON -DRMSYNTH_WARNINGS_AS_ERRORS=ON
      - run: cmake --build build/native --parallel
      - run: ctest --test-dir build/native --output-on-failure
      - run: python tools/check_public_repo.py
      - run: python tools/check_links.py
      - run: python examples/all_parities.py
      - run: python examples/preserve_terminal_map.py

  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install -e '.[dev]'
      - run: pytest -q

  package:
    needs: [quality, tests]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e '.[dev]'
      - run: python -m build
      - run: twine check dist/*
      - run: check-wheel-contents dist/*.whl
      - run: python tools/check_dist.py dist/*
      - run: python -m venv /tmp/rmsynth-clean
      - run: /tmp/rmsynth-clean/bin/python -m pip install --no-index --find-links dist rmsynth-reference
      - run: cd /tmp && /tmp/rmsynth-clean/bin/rmsynth-ref --version
      - run: python -m venv /tmp/rmsynth-sdist
      - run: /tmp/rmsynth-sdist/bin/python -m pip install --no-deps dist/*.tar.gz
      - run: cd /tmp && /tmp/rmsynth-sdist/bin/rmsynth-ref --version
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: distributions
          path: dist/
